<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order Progress — Artisan Oven</title>
  <meta name="description" content="Offline fulfilment board for Artisan Oven staff." />
  <link rel="manifest" href="kitchen-manifest.json" />
  <link rel="apple-touch-icon" href="kitchen-assets/kitchen-icon.svg" />
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />
  <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin />
  <link rel="preload" href="fonts/BaarSophia.ttf" as="font" type="font/ttf" crossorigin />
  <meta name="theme-color" content="#1f3a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AO Progress" />
  <link rel="stylesheet" href="style.css" />
  <script src="/config.js"></script>
  <style>
    html, body { overscroll-behavior-y: none; }
    body { background: var(--cream); -webkit-user-select: auto; user-select: auto; }
    .kitchen-topbar, .kitchen-controls, .kitchen-item, .kitchen-stats {
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea, select {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
      touch-action: auto !important;
    }
    .kitchen-shell { max-width: 760px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 18px max(70px, env(safe-area-inset-bottom)); }
    .kitchen-topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .kitchen-brand { color: var(--forest); font-weight: 700; letter-spacing: .05em; }
    .kitchen-card, .kitchen-item { background: var(--white); border: 1px solid rgba(31,58,46,.12); border-radius: 16px; box-shadow: var(--shadow-soft); }
    .kitchen-card { padding: 28px; }
    .kitchen-card h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin-bottom: 12px; }
    .kitchen-card p { color: var(--text-soft); margin-bottom: 20px; }
    [hidden] { display: none !important; }
    .kitchen-form { display: grid; gap: 12px; }
    .kitchen-form input {
      border: 1px solid rgba(31,58,46,.25);
      border-radius: 12px;
      padding: 14px 16px;
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      width: 100%;
      box-sizing: border-box;
      background: var(--white);
      color: var(--text);
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
      touch-action: auto !important;
      cursor: text !important;
      pointer-events: auto !important;
      -webkit-appearance: none;
      appearance: none;
    }
    .kitchen-form input:focus {
      outline: 2px solid var(--forest);
      outline-offset: 1px;
      border-color: var(--forest);
    }
    .kitchen-primary, .upload-button { border: 0; border-radius: 999px; padding: 14px 20px; background: var(--forest); color: var(--white); font: inherit; font-weight: 700; cursor: pointer; }
    .kitchen-secondary { border: 1px solid rgba(31,58,46,.2); border-radius: 999px; padding: 12px 16px; background: transparent; color: var(--forest); font: inherit; font-weight: 700; cursor: pointer; }
    .kitchen-error, .access-error { color: var(--terracotta); font-weight: 700; margin-top: 12px; }
    .kitchen-header { position: sticky; top: 0; z-index: 2; background: rgba(247,243,236,.96); padding: 10px 0 12px; padding-top: max(10px, env(safe-area-inset-top)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .kitchen-stats { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .kitchen-timer { border: 0; background: transparent; color: var(--forest); font: inherit; font-weight: 800; cursor: pointer; }
    .kitchen-timer.is-warning { color: #a26300; }
    .kitchen-timer.is-danger { color: #b23b2d; }
    .kitchen-session { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-soft); font-size: .9rem; }
    .kitchen-progress { color: var(--forest); font-weight: 700; white-space: nowrap; }
    .kitchen-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .kitchen-controls button { min-height: 44px; border: 1px solid rgba(31,58,46,.18); border-radius: 999px; padding: 8px 14px; background: var(--white); color: var(--forest); font: inherit; font-size: .9rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .kitchen-controls button.is-active { background: var(--forest); color: var(--white); }
    .kitchen-list { display: grid; gap: 10px; }
    .kitchen-item { width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; text-align: left; color: var(--text); cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
    .kitchen-item:hover { border-color: rgba(31,58,46,.3); box-shadow: 0 4px 12px rgba(31,58,46,.08); }
    .kitchen-item:active { transform: scale(0.99); }
    .kitchen-item.is-complete { opacity: .55; background: rgba(31,58,46,.03); border-color: rgba(31,58,46,.08); }
    .kitchen-section-divider { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-soft); margin: 24px 0 10px 4px; display: flex; align-items: center; gap: 10px; }
    .kitchen-section-divider::after { content: ""; flex: 1; height: 1px; background: rgba(31,58,46,.12); }
    .kitchen-item-main { display: grid; gap: 2px; min-width: 0; }
    .kitchen-item-main strong { color: var(--forest); font-size: 1.08rem; }
    .kitchen-item-main span { color: var(--text-soft); font-size: .92rem; }
    .kitchen-item-meta { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; white-space: nowrap; }
    .item-check { color: var(--forest); font-size: 1.5rem; }
    .allergy-badge { font-size: 1rem; }
    .kitchen-empty { text-align: center; color: var(--text-soft); padding: 44px 20px; }
    .upload-button { display: inline-block; margin-bottom: 16px; text-align: center; }
    .upload-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .kitchen-detail { position: fixed; inset: 0; z-index: 5; background: rgba(22,40,31,.45); display: grid; align-items: end; }
    #kitchen-auth-modal { display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #kitchen-auth-modal .kitchen-detail-panel { border-radius: 20px; max-width: 440px; width: 100%; margin: auto; box-shadow: 0 20px 48px rgba(0,0,0,0.28); transform: translateZ(0); -webkit-user-select: auto; user-select: auto; }
    .kitchen-detail-panel { background: var(--cream); border-radius: 22px 22px 0 0; padding: 26px 20px max(26px, env(safe-area-inset-bottom)); max-width: 760px; width: 100%; margin: 0 auto; -webkit-user-select: auto; user-select: auto; }
    .kitchen-detail-close { float: right; width: 44px; height: 44px; border: 0; background: transparent; color: var(--forest); font-size: 1.8rem; cursor: pointer; }
    
    /* Live Sync Indicator */
    .sync-status {
      display: inline-flex;
      align-items: center;
      color: var(--forest);
      font-weight: 800;
      font-size: 0.72rem;
      background: rgba(31, 58, 46, 0.08);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(31, 58, 46, 0.15);
      margin-right: 8px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .sync-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #2D5832;
      border-radius: 50%;
      margin-right: 6px;
      animation: sync-pulse 2s infinite;
    }
    @keyframes sync-pulse {
      0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(45, 88, 50, 0.4); }
      70% { transform: scale(1.1); opacity: 0.8; box-shadow: 0 0 0 6px rgba(45, 88, 50, 0); }
      100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(45, 88, 50, 0); }
    }
    .detail-kicker { color: var(--text-soft); font-weight: 700; margin: 0; }
    .detail-size { color: var(--forest); font-size: 1.15rem; }
    .complete-btn { width: 100%; border: 0; border-radius: 14px; padding: 20px; margin: 18px 0; background: var(--terracotta); color: var(--white); font: inherit; font-weight: 800; letter-spacing: .05em; cursor: pointer; }
    .detail-allergy { background: #fff1c8; border-radius: 10px; padding: 10px 12px; color: #704f00; font-weight: 700; }
    .kitchen-detail details { color: var(--forest); }
    .kitchen-detail summary { cursor: pointer; font-weight: 700; }
    .kitchen-detail dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin-bottom: 0; }
    .kitchen-detail dt { color: var(--text-soft); }
    .kitchen-detail dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 500px) { .kitchen-card { padding: 22px 18px; } .kitchen-stats { align-items: flex-start; flex-direction: column; } }
  </style>
  <script src="/config.js"></script>
</head>
<body>
  <main class="kitchen-shell">
    <section id="kitchen-board">
      <header class="kitchen-header">
        <div class="kitchen-topbar">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="sync-status"><span class="sync-dot"></span> LIVE SYNC</span>
            <span class="kitchen-brand">AO PROGRESS</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="kitchen-fetch-server" class="kitchen-secondary" type="button" style="padding: 10px 16px; font-size: 0.9rem;">Import</button>
            <label id="kitchen-upload-button" class="upload-button" style="margin-bottom: 0; padding: 10px 16px; font-size: 0.9rem;">Upload<input id="kitchen-upload" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" /></label>
          </div>
        </div>
        <div class="kitchen-stats"><button id="kitchen-timer" class="kitchen-timer" type="button">⏱ Set cutoff</button><strong id="kitchen-progress" class="kitchen-progress">0 / 0 pizzas ready</strong></div>
        <div id="kitchen-session" class="kitchen-session"></div>
      </header>
      <div class="kitchen-controls">
        <button data-sort="class" class="is-active" type="button">By class</button><button data-sort="order" type="button">By order</button>
        <button data-filter="all" class="is-active" type="button">All</button><button data-filter="incomplete" type="button">Incomplete</button><button data-filter="complete" type="button">Complete</button>
      </div>
      <div id="kitchen-error" class="kitchen-error" hidden></div>
      <div id="kitchen-list" class="kitchen-list"></div>
      <div id="kitchen-empty" class="kitchen-empty" hidden>
        <p>No items match this view.</p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px;">
          <button id="kitchen-fetch-empty" class="kitchen-primary" type="button">Import from server</button>
          <button id="kitchen-upload-empty" class="kitchen-secondary" type="button">Upload file</button>
        </div>
      </div>
    </section>
  </main>
  <div id="kitchen-auth-modal" class="kitchen-detail" hidden>
    <section class="kitchen-detail-panel" role="dialog" aria-modal="true" style="max-width: 440px;">
      <button id="kitchen-auth-close" class="kitchen-detail-close" type="button" aria-label="Close">×</button>
      <h3 style="color: var(--forest); margin-top: 0; margin-bottom: 8px;">Secure Backend Import</h3>
      <p style="color: var(--text-soft); font-size: 0.92rem; margin-bottom: 16px;">Enter the admin passcode to securely retrieve current week orders from the backend server.</p>
      <form id="kitchen-auth-form" class="kitchen-form">
        <input id="kitchen-auth-password" name="password" type="password" placeholder="Admin passcode" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" />
        <div id="kitchen-auth-error" class="kitchen-error" hidden></div>
        <button id="kitchen-auth-submit" class="kitchen-primary" type="submit" style="margin-top: 8px;">Verify & Import Orders</button>
      </form>
    </section>
  </div>
  <div id="kitchen-detail" class="kitchen-detail" hidden><section class="kitchen-detail-panel" role="dialog" aria-modal="true"><button id="kitchen-detail-close" class="kitchen-detail-close" type="button" aria-label="Close">×</button><div id="kitchen-detail-content"></div></section></div>
  <script src="script.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="kitchen-board.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./kitchen-sw.js?v=5', { scope: './', updateViaCache: 'none' })
          .then(function(reg) {
            try { reg.update(); } catch (e) {}
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                try { reg.update(); } catch (e) {}
              }
            });
          })
          .catch(function(err) {
            console.error('AO Kitchen PWA registration failed:', err);
          });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
