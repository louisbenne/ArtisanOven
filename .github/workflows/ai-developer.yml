name: AI Developer (Aider)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-coder:
    # Trigger if a new issue is opened OR if someone comments "@ai-coder" on an existing issue
    if: ${{ github.event_name == 'issues' || (github.event.issue.pull_request == null && contains(github.event.comment.body, '@ai-coder')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so Aider can build an accurate repo map
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags
          python -m pip install aider-chat

      - name: Setup Git and Branch
        run: |
          git config --global user.name "AI Developer Agent"
          git config --global user.email "actions@github.com"
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # 1. Format the task instructions
          echo "GitHub Issue: $ISSUE_TITLE" > request.txt
          echo "" >> request.txt
          echo "Description:" >> request.txt
          echo "$ISSUE_BODY" >> request.txt
          echo "" >> request.txt
          echo "Additional comments:" >> request.txt
          echo "$COMMENT_BODY" >> request.txt
          echo "" >> request.txt
          echo "Please review the repository and implement the requested changes." >> request.txt
          
          # 2. Configure the Gemini Model
          MODEL_NAME="${{ vars.GEMINI_MODEL }}"
          if [ -z "$MODEL_NAME" ]; then
            MODEL_NAME="gemini-1.5-pro-latest" # More stable fallback
          fi
          
          # 3. Run Aider autonomously
          export AIDER_DARK_MODE=false
          # By default Aider uses auto-commits when editing files.
          # We pass `--read GEMINI.md` to ensure it reads the repository rules.
          aider --model "gemini/$MODEL_NAME" --message-file request.txt --yes --read GEMINI.md

      - name: Push to GitHub and Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if Aider actually made any commits
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse main)" ]; then
            echo "No code changes were made by the AI."
            exit 0
          fi
          
          # Push the branch to the repository
          git push origin ${{ env.BRANCH_NAME }}
          
          # Use GitHub CLI to open a Pull Request automatically
          gh pr create \
            --title "🤖 AI Fix: ${{ github.event.issue.title }}" \
            --body "This Pull Request was generated autonomously to resolve issue #${{ github.event.issue.number }}. Please review the changes before merging." \
            --base main \
            --head ${{ env.BRANCH_NAME }}
