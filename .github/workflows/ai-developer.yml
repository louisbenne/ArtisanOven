name: AI Developer (Aider)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-coder:
    # Trigger if a new issue is opened OR if someone comments "@ai-coder" on an existing issue
    if: ${{ github.event_name == 'issues' || (github.event.issue.pull_request == null && contains(github.event.comment.body, '@ai-coder')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so Aider can build an accurate repo map
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags
          python -m pip install aider-chat google-generativeai

      - name: Setup Git and Branch
        run: |
          git config --global user.name "AI Developer Agent"
          git config --global user.email "actions@github.com"
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # 1. Format the task instructions
          echo "GitHub Issue: $ISSUE_TITLE" > request.txt
          echo "" >> request.txt
          echo "Description:" >> request.txt
          echo "$ISSUE_BODY" >> request.txt
          echo "" >> request.txt
          echo "Additional comments:" >> request.txt
          echo "$COMMENT_BODY" >> request.txt
          echo "" >> request.txt
          echo "CRITICAL INSTRUCTION: You are an autonomous AI developer executing inside a CI/CD pipeline. Your ONLY purpose is to write code and edit files. You must use the provided tools to search the repository, add relevant files to the chat, and apply the exact changes requested. DO NOT reply with conversational text or advice. YOU MUST OUTPUT FILE EDITS." >> request.txt
          
          # 2. Configure the Gemini Model
          MODEL_NAME="${{ vars.GEMINI_MODEL }}"
          if [ -z "$MODEL_NAME" ]; then
            MODEL_NAME="gemini-2.5-pro"
          fi
          
          # 3. Run Aider autonomously
          export AIDER_DARK_MODE=false
          # We pass `--read GEMINI.md` to ensure it reads the repository rules.
          aider --model "gemini/$MODEL_NAME" --message-file request.txt --yes --read GEMINI.md

      - name: Debug AI Output (If no commits were made)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{-1})" ]; then
            echo "--- NO COMMITS MADE. PRINTING AI CHAT LOGS FOR DEBUGGING ---"
            if [ -f .aider.chat.history.md ]; then
              # Comment on the issue to inform the user
              gh issue comment ${{ github.event.issue.number }} -b "⚠️ **AI Developer Agent Failed to make code changes.** The agent ran successfully but did not output any file edits.

              <details>
              <summary>View AI Internal Chat Log</summary>
              
              \`\`\`markdown
              $(cat .aider.chat.history.md)
              \`\`\`
              </details>"
            fi
            exit 1
          fi

      - name: Push to GitHub and Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push the branch to the repository
          git push origin ${{ env.BRANCH_NAME }}
          
          # Use GitHub CLI to open a Pull Request automatically
          gh pr create \
            --title "🤖 AI Fix: ${{ github.event.issue.title }}" \
            --body "This Pull Request was generated autonomously to resolve issue #${{ github.event.issue.number }}. Please review the changes before merging." \
            --base main \
            --head ${{ env.BRANCH_NAME }}
